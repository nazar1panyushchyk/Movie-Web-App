<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./src/css/variables.css" />
    <link rel="stylesheet" href="./src/css/header.css" />
    <link rel="stylesheet" href="./src/css/hero.css" />
    <link rel="stylesheet" href="./src/css/sections.css" />
    <link rel="stylesheet" href="./src/css/movie-card.css" />
    <link rel="stylesheet" href="./src/css/genres.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/src/assets/img/logo-light.svg"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie-Web-App</title>
  </head>
  <body>
    <header>
      <img
        class="header-logo"
        src="./src/assets/img/logo-dark.svg"
        alt="Logo"
      />
      <a href="">Home</a>
      <a href="">Movies</a>
      <a href="">Series</a>
      <a href="./src/pages/favorites.html">Favorites</a>
      <form class="search-form">
        <input
          type="search"
          class="search-input"
          placeholder="Search movies or TV shows..."
          required
        />
        <button type="submit">Search</button>
        <img src="./src/assets/img/moon-theme.svg" alt="Dark theme" />
      </form>
    </header>
    <main>
      <section class="hero">
        <div class="hero-content"></div>
        <div class="hero-carousel"></div>
      </section>

      <section class="search-results hidden">
        <h2>Search Results</h2>
        <div class="search-results-list"></div>
      </section>

      <section class="trending content-section">
        <h2>Trends</h2>
        <a href="./src/pages/media.html?type=trending" class="section-link">See More</a>
        <div class="trending-list media-row"></div>
      </section>

      <section class="movies content-section">
        <h2>Movies</h2>
        <a href="./src/pages/media.html?type=movie" class="section-link">See More</a>
        <div class="movies-genres genre-row"></div>
        <div class="movies-list media-row"></div>
      </section>

      <section class="series content-section">
        <h2>Series</h2>
        <a href="./src/pages/media.html?type=tv" class="section-link">See More</a>
        <div class="series-genres genre-row"></div>
        <div class="series-list media-row"></div>
      </section>
    </main>

    <footer>
      <p>Movie &amp; Series Website</p>
    </footer>
    <script type="module" src="./src/js/main.js"></script>
  </body>
</html>

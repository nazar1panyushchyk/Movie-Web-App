<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./src/css/movie-card.css" />
    <link rel="stylesheet" href="./src/css/genres.css">
    <link
      rel="icon"
      type="image/svg+xml"
      href="/src/assets/img/head-logo.svg"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie-Web-App</title>
  </head>
  <body>
    <header>
      <a href="">Home</a>
      <a href="">Movies</a>
      <a href="">Series</a>
      <a href="./src/pages/favorites.html">Favorites</a>
      <form class="search-form">
        <input
          type="search"
          class="search-input"
          placeholder="Search movies or TV shows..."
          required
        />
        <button type="submit">Search</button>
      </form>
    </header>
    <main>
      <section class="hero"></section>

      <section class="search-results hidden">
        <h2>Search Results</h2>
        <div class="search-results-list"></div>
      </section>

      <section class="trending">
        <h2>Trends</h2>
        <p>See More</p>
        <div class="trending-list"></div>
      </section>

      <section class="movies">
        <h2>Movies</h2>
        <p>See More</p>
        <div class="movies-genres"></div>
        <div class="movies-list"></div>
      </section>

      <section class="series">
        <h2>Series</h2>
        <p>See More</p>
        <div class="series-genres"></div>
        <div class="series-list"></div>
      </section>
    </main>

    <footer></footer>
    <script type="module" src="./src/js/main.js"></script>
  </body>
</html>
